# Deployment variant for hosts that sit BEHIND an existing reverse proxy
# (e.g. wordpress-1, fronted by Traefik on the Gate). No Caddy, no 80/443:
# the Go server is published on an internal port and the external proxy
# terminates TLS and routes to it.
#
#   cp .env.example .env   # fill secrets + KFIRE_DOMAIN + KFIRE_STEAM_API_KEY
#   docker compose -f docker-compose.proxied.yml up -d --build
#
# Then add the Traefik route from deploy/traefik/kfire.yml on the proxy host.

name: kfire

services:
  server:
    build: .
    image: ghcr.io/knightsofeternity/kfire-server:latest
    restart: unless-stopped
    # Published so the upstream proxy can reach it. Defaults to all interfaces
    # on :8090; set KFIRE_BIND=172.31.3.32 to pin to the private interface.
    ports:
      - "${KFIRE_BIND:-0.0.0.0}:${KFIRE_HTTP_PORT:-8090}:8080"
    environment:
      KFIRE_LISTEN_ADDR: ":8080"
      KFIRE_DATABASE_URL: postgres://kfire:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/kfire?sslmode=disable
      KFIRE_REDIS_URL: redis://redis:6379/0
      KFIRE_JWT_SECRET: ${KFIRE_JWT_SECRET:?set in .env}
      KFIRE_MASTER_KEY: ${KFIRE_MASTER_KEY:?set in .env}
      # Must match the public URL the proxy serves (used for Steam OpenID realm).
      KFIRE_PUBLIC_URL: https://${KFIRE_DOMAIN:?set in .env}
      KFIRE_STEAM_API_KEY: ${KFIRE_STEAM_API_KEY:-}
      KFIRE_BATTLENET_CLIENT_ID: ${KFIRE_BATTLENET_CLIENT_ID:-}
      KFIRE_BATTLENET_CLIENT_SECRET: ${KFIRE_BATTLENET_CLIENT_SECRET:-}
      KFIRE_ORG_NAME: ${KFIRE_ORG_NAME:-My Organization}
      KFIRE_OPEN_REGISTRATION: ${KFIRE_OPEN_REGISTRATION:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kfire
      POSTGRES_USER: kfire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kfire -d kfire"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
